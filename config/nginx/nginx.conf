# ──────────────────────────────────────────────────────────────────────
# nginx Configuration — Computer Networks Phase 1
#
# Machine:  Mac 2 (10.7.9.236)
# Role:     HTTPS edge / TLS termination / reverse proxy / load balancer
# Listens:  8443 (HTTPS)
# Backends: 10.7.16.15:3001 (Backend A), 10.7.16.15:3002 (Backend B)
# ──────────────────────────────────────────────────────────────────────

# ── Upstream: round-robin backend pool ────────────────────────────────
# nginx uses round-robin by default when no balancing directive is set.
# Each new request is forwarded to the next server in order.
upstream backend_pool {
    server 10.7.16.15:3001;   # Backend A on Mac 3
    server 10.7.16.15:3002;   # Backend B on Mac 3
}

server {
    # ── HTTPS listener ────────────────────────────────────────────────
    listen       8443 ssl;
    server_name  app.team2.test;

    # ── TLS certificate & key ─────────────────────────────────────────
    # Generate these on Mac 2 (see config/tls/README.md for instructions).
    # Do NOT commit the actual .key / .crt files to Git.
    ssl_certificate      /usr/local/etc/nginx/ssl/app.team2.test.crt;
    ssl_certificate_key  /usr/local/etc/nginx/ssl/app.team2.test.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    # ── Reverse proxy to backend pool ─────────────────────────────────
    location / {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass the X-Backend header from backends to the client.
        # This allows us to verify which backend served each request.
        proxy_pass_header  X-Backend;
    }
}
